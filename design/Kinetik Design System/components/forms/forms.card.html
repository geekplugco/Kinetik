<!-- @dsCard group="Components" viewport="700x400" name="Forms — Input · Select · Swatch · Stepper" subtitle="Fields and variant controls" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .root { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .block { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .rule { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Input, Select, OptionSwatch, QuantityStepper, Icon } = window.KinetikDesignSystem_fefe1a;
    const { useState } = React;
    function Demo() {
      const [color, setColor] = useState('Volt');
      const [sz, setSz] = useState('M');
      const [qty, setQty] = useState(1);
      return (
        <div className="root">
          <div className="block">
            <Input label="Email" placeholder="you@domain.com" />
            <Input iconLeft={<Icon name="search" size={16} />} placeholder="Search gear" />
            <Input label="Discount" invalid hint="Code not recognized" defaultValue="VOLT10" />
            <Select label="Sort" options={[{value:'featured',label:'Featured'},{value:'new',label:'Newest'},{value:'price',label:'Price · Low to High'}]} />
          </div>
          <div className="block">
            <span className="rule">Colorway</span>
            <div className="row">
              <OptionSwatch kind="color" value="Volt" swatch="#CCFF00" selected={color==='Volt'} onSelect={setColor} />
              <OptionSwatch kind="color" value="Ink" swatch="#0A0A0A" selected={color==='Ink'} onSelect={setColor} />
              <OptionSwatch kind="color" value="Bone" swatch="#EDEAE2" selected={color==='Bone'} onSelect={setColor} />
              <OptionSwatch kind="color" value="Steel" swatch="#7C8794" disabled />
            </div>
            <span className="rule">Size · {sz}</span>
            <div className="row">
              {['XS','S','M','L','XL'].map(s => (
                <OptionSwatch key={s} kind="size" value={s} selected={sz===s} disabled={s==='XS'} onSelect={setSz} />
              ))}
            </div>
            <span className="rule">Quantity</span>
            <QuantityStepper value={qty} min={1} max={10} onChange={setQty} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
