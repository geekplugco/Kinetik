<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .root { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  .rule { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Accordion, StarRating, Dialog, Toast, Button } = window.KinetikDesignSystem_fefe1a;
    const { useState } = React;
    function Demo() {
      const [dlg, setDlg] = useState(false);
      const [toast, setToast] = useState(false);
      return (
        <div>
          <div className="root">
            <div>
              <div className="rule">Rating</div>
              <div className="stack">
                <StarRating value={4.5} count={128} showValue />
                <StarRating value={3} count={12} />
                <StarRating value={5} size={18} />
              </div>
              <div className="rule" style={{marginTop:24}}>Transient & overlay</div>
              <div className="row">
                <Button onClick={() => setDlg(true)}>Size Guide</Button>
                <Button variant="primary" onClick={() => setToast(true)}>Add to Cart</Button>
              </div>
            </div>
            <div>
              <div className="rule">Accordion</div>
              <Accordion defaultOpen={['desc']} items={[
                { id:'desc', title:'Description', content:'3-layer Gore-Tex shell engineered for movement. Laser-cut vents, magnetic storm placket, fully taped seams.' },
                { id:'fit', title:'Fit & Sizing', content:'Boxed regular. Size up for layering.' },
                { id:'ship', title:'Shipping & Returns', content:'Ships in 24h · free over $200 · 60-day returns.' },
              ]} />
            </div>
          </div>
          <Dialog open={dlg} onClose={() => setDlg(false)} title="Size Guide"
            footer={<Button variant="inverse" block onClick={() => setDlg(false)}>Done</Button>}>
            <p style={{margin:0,fontSize:14,lineHeight:1.6,color:'var(--text-body)'}}>Measurements in cm. Model is 183cm, wearing M. Between sizes? Size up for a layering fit.</p>
          </Dialog>
          <Toast open={toast} onClose={() => setToast(false)} message="Added to cart" action={{label:'View Cart', onClick:()=>setToast(false)}} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
