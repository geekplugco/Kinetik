<!-- @dsCard group="Components" viewport="700x540" name="Commerce — Product Card · Cart Drawer" subtitle="Hover a card · open the smart cart" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-sunken); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .rule { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border-hairline); border: 1px solid var(--border-hairline); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { ProductCard, Drawer, CartLineItem, Button, IconButton, Icon } = window.KinetikDesignSystem_fefe1a;
    const { useState } = React;
    const COLORS = [{name:'Volt',swatch:'#CCFF00'},{name:'Ink',swatch:'#0A0A0A'},{name:'Bone',swatch:'#EDEAE2'}];
    function Demo() {
      const [open, setOpen] = useState(false);
      const [qty, setQty] = useState(1);
      return (
        <div>
          <div className="bar">
            <span className="rule">New Arrivals · Hover a tile</span>
            <IconButton aria-label="Open cart" bordered onClick={() => setOpen(true)}><Icon name="bag" /></IconButton>
          </div>
          <div className="grid">
            <ProductCard name="Shell-01 Hardshell" category="Outerwear" price={336} compareAt={420} badge="New" colors={COLORS} code="KX-SHELL-01" onAdd={() => setOpen(true)} />
            <ProductCard name="Cargo Tech Pant" category="Bottoms" price={210} colors={COLORS.slice(0,2)} code="KX-PANT-02" onAdd={() => setOpen(true)} />
            <ProductCard name="Field Monitors" category="Audio" price={290} compareAt={340} colors={[{name:'Ink',swatch:'#0A0A0A'}]} code="KX-AUD-03" onAdd={() => setOpen(true)} />
          </div>
          <Drawer open={open} onClose={() => setOpen(false)} title="Cart · 2"
            footer={<Button variant="inverse" block iconRight={<Icon name="arrowRight" size={17} />}>Checkout — $546</Button>}>
            <CartLineItem name="Shell-01 Hardshell" variant="Volt · M" price={336} compareAt={420} qty={qty} code="KX-SHELL-01" onQty={setQty} />
            <CartLineItem name="Field Monitors" variant="Ink" price={210} qty={1} code="KX-AUD-03" />
            <div style={{padding:'16px 20px'}}>
              <span className="rule">Frequently bought together</span>
            </div>
          </Drawer>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
