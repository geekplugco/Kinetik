<!-- @dsCard group="Components" viewport="700x420" name="Variants — Color × Size Matrix" subtitle="Live availability, instant swap, gated CTA" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .root { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: start; }
  .media { position: relative; aspect-ratio: 4/5; background-color: var(--ink-100);
    background-image: linear-gradient(var(--ink-150) 1px, transparent 1px), linear-gradient(90deg, var(--ink-150) 1px, transparent 1px);
    background-size: 24px 24px; display: flex; align-items: center; justify-content: center; }
  .media span { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-400); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { VariantPicker, PriceTag, Button, Icon } = window.KinetikDesignSystem_fefe1a;
    const isUnavailable = VariantPicker.isUnavailable;
    const { useState } = React;
    const COLORS = [{name:'Volt',swatch:'#CCFF00'},{name:'Ink',swatch:'#0A0A0A'},{name:'Bone',swatch:'#EDEAE2'}];
    const SIZES = ['XS','S','M','L','XL'];
    const UNAVAIL = ['Volt|XS','Ink|XS','Bone|XS','Volt|XL','Bone|S'];
    function Demo() {
      const [v, setV] = useState({ color:'Volt', size:'M' });
      const soldOut = !v.size || isUnavailable(UNAVAIL, v.color, v.size);
      return (
        <div className="root">
          <div className="media"><span>KX-SHELL-01 · {v.color}</span></div>
          <div>
            <PriceTag price={336} compareAt={420} size="lg" />
            <VariantPicker colors={COLORS} sizes={SIZES} unavailable={UNAVAIL} value={v} onChange={setV} onGuide={()=>{}} style={{margin:'20px 0 22px'}} />
            <Button variant="primary" block size="lg" disabled={soldOut}
              iconLeft={!soldOut ? <Icon name="bag" size={18}/> : undefined}>
              {soldOut && v.size ? 'Sold Out' : !v.size ? 'Select a Size' : 'Add to Cart · $336'}
            </Button>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
