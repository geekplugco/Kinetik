<!-- @dsCard group="Colors" viewport="700x190" name="Semantic — Light" subtitle="Surfaces & text tokens on paper" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-sunken); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--surface-card); border: var(--border); padding: 12px 14px; }
  .dot { width: 28px; height: 28px; flex: none; box-shadow: inset 0 0 0 1px var(--ink-200); }
  .meta b { font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--text-strong); display: block; }
  .meta span { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.03em; }
</style>
</head>
<body>
  <div class="grid">
    <div class="row"><div class="dot" style="background:var(--surface-card)"></div><div class="meta"><b>Surface · Card</b><span>--surface-card</span></div></div>
    <div class="row"><div class="dot" style="background:var(--surface-sunken)"></div><div class="meta"><b>Surface · Sunken</b><span>--surface-sunken</span></div></div>
    <div class="row"><div class="dot" style="background:var(--text-strong)"></div><div class="meta"><b>Text · Strong</b><span>--text-strong</span></div></div>
    <div class="row"><div class="dot" style="background:var(--text-muted)"></div><div class="meta"><b>Text · Muted</b><span>--text-muted</span></div></div>
    <div class="row"><div class="dot" style="background:var(--surface-inverse)"></div><div class="meta"><b>Surface · Inverse</b><span>--surface-inverse</span></div></div>
    <div class="row"><div class="dot" style="background:var(--border-hairline)"></div><div class="meta"><b>Border · Hairline</b><span>--border-hairline</span></div></div>
  </div>
</body>
</html>
