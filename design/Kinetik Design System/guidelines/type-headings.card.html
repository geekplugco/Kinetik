<!-- @dsCard group="Type" viewport="700x300" name="Heading Scale" subtitle="H1–H4 — Space Grotesk display" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: var(--border); }
  .row:last-child { border-bottom: none; }
  .t { font-family: var(--font-display); font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; }
  .c { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.04em; white-space: nowrap; }
</style>
</head>
<body>
  <div class="row"><div class="t" style="font-size:44px">Heading One</div><div class="c">H1 · 44</div></div>
  <div class="row"><div class="t" style="font-size:32px">Heading Two</div><div class="c">H2 · 32</div></div>
  <div class="row"><div class="t" style="font-size:24px">Heading Three</div><div class="c">H3 · 24</div></div>
  <div class="row"><div class="t" style="font-size:20px">Heading Four</div><div class="c">H4 · 20</div></div>
</body>
</html>
