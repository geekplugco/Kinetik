<!-- @dsCard group="Type" viewport="700x180" name="Mono — Space Mono" subtitle="Prices, specs, labels — the spec-sheet voice" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .chip { font-family: var(--font-mono); border: var(--border); padding: 8px 12px; font-size: 12px; letter-spacing: 0.06em; color: var(--text-body); }
  .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
  .price { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
  .sale { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 5px 9px; font-weight: 700; }
</style>
</head>
<body>
  <span class="price">$420.00</span>
  <span class="label">SKU · KX-SHELL-01</span>
  <span class="chip">WEIGHT 480G</span>
  <span class="chip">GORE-TEX 3L</span>
  <span class="sale">−20%</span>
  <span class="label">In Stock · Ships 24h</span>
</body>
</html>
