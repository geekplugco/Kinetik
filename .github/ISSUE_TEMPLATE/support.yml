name: Theme support request
description: Report a problem or ask a question about the Kinetik theme
title: "[Support] "
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out. Check the [documentation](../tree/feat/kinetik-y5d-theme-engine/docs/merchant) and [FAQ](../blob/feat/kinetik-y5d-theme-engine/docs/merchant/faq.md) first — most setup questions are answered there. Support replies within two business days.
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: Email address
      description: Where we should reply
    validations:
      required: true
  - type: input
    id: store_url
    attributes:
      label: Store URL
      placeholder: https://storename.myshopify.com
    validations:
      required: true
  - type: input
    id: theme_version
    attributes:
      label: Theme version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the problem
      description: What happened, what you expected, and the steps to reproduce it. Drag screenshots into this field to attach them.
    validations:
      required: true
